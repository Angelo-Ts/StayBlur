name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          echo '=== Chromium installation ==='
          if command -v google-chrome >/dev/null 2>&1; then
            echo 'Using preinstalled Google Chrome'
            echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo 'Using preinstalled Chromium'
            echo "CHROMIUM_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo 'No browser found; installing Chromium'
            sudo apt-get update
            sudo apt-get install -y chromium
            echo "CHROMIUM_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          fi
          echo '=== Chromium binary ==='
          "$CHROMIUM_PATH" --version || true
          echo "CHROMIUM_PATH=$CHROMIUM_PATH"
      - name: Install Xvfb
        run: |
          if command -v Xvfb >/dev/null 2>&1 && command -v xvfb-run >/dev/null 2>&1; then
            echo 'Xvfb already available'
          else
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
      - name: Run browser smoke
        env:
          BROWSER_HEADLESS: '0'
        run: |
          echo '=== Browser smoke: starting ==='
          echo "Runner: $(uname -a)"
          echo "Node: $(node --version)"
          echo "Working directory: $PWD"
          echo '=== Extension files ==='
          find extension -maxdepth 2 -type f | sort
          echo '=== Launching Chromium smoke test under Xvfb ==='
          node scripts/browser-smoke.mjs
          echo '=== Browser smoke: finished ==='
