name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          echo '=== Chromium installation ==='
          sudo apt-get update
          sudo apt-get install -y chromium
          echo '=== Chromium binary ==='
          command -v chromium || command -v chromium-browser
          chromium --version || chromium-browser --version
      - name: Run browser smoke
        run: |
          echo '=== Browser smoke: starting ==='
          echo "Runner: $(uname -a)"
          echo "Node: $(node --version)"
          echo "Working directory: $PWD"
          echo '=== Extension files ==='
          find extension -maxdepth 2 -type f | sort
          echo '=== Launching Chromium smoke test ==='
          node scripts/browser-smoke.mjs
          echo '=== Browser smoke: finished ==='
