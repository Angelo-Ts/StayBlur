<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>progettoBlur browser fixture</title></head>
<body>
  <main id="pb-e2e-main">Browser fixture</main>
  <iframe id="pb-e2e-frame" src="/frame.html" title="same-origin frame"></iframe>
  <script>
    customElements.define('pb-e2e-host', class extends HTMLElement {
      connectedCallback() {
        const root = this.attachShadow({ mode: 'open' });
        root.innerHTML = '<section id="pb-e2e-shadow">Shadow fixture</section>';
      }
    });
    document.body.insertAdjacentHTML('beforeend', '<pb-e2e-host></pb-e2e-host>');
    const check = () => {
      const mainReady = !!document.getElementById('pb-selection-style');
      const frame = document.getElementById('pb-e2e-frame');
      const frameReady = !!frame?.contentDocument?.getElementById('pb-selection-style');
      const shadowHost = document.querySelector('pb-e2e-host');
      const shadowReady = !!shadowHost?.shadowRoot?.getElementById('pb-rule-style');
      document.documentElement.dataset.pbE2eMain = String(mainReady);
      document.documentElement.dataset.pbE2eFrame = String(frameReady);
      document.documentElement.dataset.pbE2eShadow = String(shadowReady);
      if (mainReady && frameReady && shadowReady) document.documentElement.dataset.pbE2e = 'pass';
    };
    new MutationObserver(check).observe(document, { childList: true, subtree: true });
    window.addEventListener('load', check);
    setTimeout(check, 750);
  </script>
</body>
</html>
